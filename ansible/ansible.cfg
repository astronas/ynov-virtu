[defaults]
inventory = ./inventory/hosts.ini
# ./roles            -> tes rôles locaux (common, web, db, zabbix wrapper, bastion)
# ./external/.../roles -> rôle jumpserver cloné depuis astronas/jumpserver
roles_path = ./roles:./external/jumpserver/roles
# Collections installées dans le projet : indispensable pour que la version épinglée
# de community.zabbix (cf. requirements.yml) prime sur celle empaquetée par apt dans
# /usr/lib/python3/dist-packages (trop ancienne, sans support Debian 13).
collections_path = ./collections
host_key_checking = False
# Journalise tout le run dans un fichier + affiche la duree de chaque tache
# (profile_tasks) et un recap des plus lentes en fin de run.
log_path = ./ansible.log
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
# Les VMs de lab sont recreees souvent -> leur cle d'hote SSH change et provoque
# des blocages "REMOTE HOST IDENTIFICATION HAS CHANGED" (qui desactivent meme
# l'auth par mot de passe). On ignore donc completement known_hosts.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
# Moins d'operations SSH par tache => runs plus rapides (sudo NOPASSWD OK sur les VMs).
pipelining = True
