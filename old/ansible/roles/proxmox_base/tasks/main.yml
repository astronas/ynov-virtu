---
# Role : proxmox_base
# Tâches d'initialisation commune à tous les nœuds Proxmox

- name: Supprimer le dépôt enterprise (requiert licence payante)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    state: absent

- name: Supprimer le dépôt Ceph enterprise
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/ceph.list
    state: absent

- name: Ajouter le dépôt no-subscription Proxmox
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.list
    content: |
      deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription
    mode: "0644"

- name: Mettre à jour le cache APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les packages de base
  ansible.builtin.apt:
    name: "{{ proxmox_packages }}"
    state: present

- name: Configurer le fuseau horaire Europe/Paris
  community.general.timezone:
    name: Europe/Paris
  notify: restart chrony

- name: Configurer le service chrony (NTP)
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: "0644"
  notify: restart chrony

- name: Activer et démarrer qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: started
    enabled: true

- name: Désactiver le message de souscription dans l'UI Proxmox
  ansible.builtin.replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: "res === null \\|\\| res === undefined \\|\\| !res \\|\\| res"
    replace: "false && res"
  ignore_errors: true
